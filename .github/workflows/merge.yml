            
name: 自动合并（每天两次）

on:
  schedule:
    - cron: '0 23 * * *'  # 北京时间 早上 7:00
    - cron: '0 7 * * *'   # 北京时间 下午 15:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 下载主源
        run: |
          curl -s "https://cdn.jsdelivr.net/gh/ipiptv/collect-txt@main/bbxx365.m3u" -o /tmp/bbxx365.m3u
          echo "原始频道数: $(grep -c '#EXTINF' /tmp/bbxx365.m3u)"

      - name: 下载 hotel_tvn
        run: |
          curl -s "https://iptv-4us.pages.dev/hotel_tvn.m3u" -o /tmp/hotel_tvn.m3u
          echo "hotel_tvn 频道数: $(grep -c '#EXTINF' /tmp/hotel_tvn.m3u)"

      - name: 过滤 + 合并（不测速，所有源全保留）
        run: |
          python3 << 'PYEOF'
          import re

          with open('/tmp/bbxx365.m3u') as f:
              lines = f.readlines()
          with open('/tmp/hotel_tvn.m3u') as f:
              lines2 = f.readlines()

          exclude = [
              '广东频道','浙江频道','湖南频道','上海频道','湖北频道','山东频道',
              '江苏频道','黑龙江频道','河北频道','四川频道','福建频道','河南频道',
              '北京频道','天津频道','重庆频道','辽宁频道','吉林频道','安徽频道',
              '江西频道','陕西频道','山西频道','云南频道','贵州频道','广西频道',
              '海南频道','甘肃频道','青海频道','宁夏频道','新疆频道','西藏频道',
              '内蒙古频道','直播中国','地方台','专区','手工区',
              '咪咕直播','spoRTs','SPORTS','优质个源','专享源','定制台',
              '英语频道','明星','电影频道','电视剧频道','主题片','纪录片',
              '戏曲频道','音乐频道','游戏频道','春晚','MTV','收音机频道'
          ]

          def is_exclude(line):
              if 'group-title=' not in line: return False
              return any(g.lower() in line.lower() for g in exclude)

          result = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('#EXTINF'):
                  if is_exclude(line):
                      i += 2
                      continue
                  result.append(line)
                  if i+1 < len(lines):
                      result.append(lines[i+1])
                  i += 2
              else:
                  i += 1

          print(f"过滤后频道数: {sum(1 for l in result if l.startswith('#EXTINF'))}")

          for line in lines2:
              if line.startswith('#EXTM3U'): continue
              if 'group-title=' in line:
                  line = re.sub(r'group-title="([^"]*)"', r'group-title="[酒店] \1"', line)
              result.append(line)

          with open('/tmp/merged.m3u', 'w') as f:
              f.write('#EXTM3U\n')
              f.writelines(result)

          print(f"合并完成: {open('/tmp/merged.m3u').read().count('#EXTINF')}")
          PYEOF

      - name: 提交到仓库（直接放根目录）
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          cd $(basename ${{ github.repository }})
          git config user.email "bot@bot.com"
          git config user.name "bot"
          cp /tmp/merged.m3u merged.m3u
          git add merged.m3u
          git commit -m "自动合并 [skip ci]" || echo "无变化"
          git push
