name: 自动合并（每天两次）

on:
  schedule:
    - cron: '0 23 * * *'  # 北京时间 早上 7:00
    - cron: '0 7 * * *'   # 北京时间 下午 15:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 下载主源
        run: |
          curl -s "https://raw.githubusercontent.com/ipiptv/collect-txt/main/bbxx365.m3u" -o /tmp/bbxx365.m3u
          echo "原始频道数: $(grep -c '#EXTINF' /tmp/bbxx365.m3u)"

      - name: 下载 hotel_tvn
        run: |
          curl -s "https://iptv-4us.pages.dev/hotel_tvn.m3u" -o /tmp/hotel_tvn.m3u
          echo "hotel_tvn 频道数: $(grep -c '#EXTINF' /tmp/hotel_tvn.m3u)"

      - name: 白名单过滤 + 合并（只保留指定分组，不测速）
        run: |
          python3 << 'PYEOF'
          import re

          with open('/tmp/bbxx365.m3u') as f:
              lines = f.readlines()
          with open('/tmp/hotel_tvn.m3u') as f:
              lines2 = f.readlines()

          # 白名单：(匹配关键词, 输出分组名)，按输出顺序排列
          groups_order = [
              ('卫视频道',    '❤️卫视频道'),
              ('央视频道',    '❤️央视频道'),
              ('专享卫视',    '❤️专享卫视'),
              ('专享央视',    '❤️专享央视'),
              ('儿童专享',    '💓儿童专享'),
              ('电影点播',    '❤️电影点播'),
              ('💓电视剧',    '💓电视剧'),
              ('台湾台',      '💓台湾台'),
              ('港澳台📶',    '💓港澳台'),
              ('国际台',      '💕国际台'),
              ('4K(Auto)',   '💓4K(Auto)'),
              ('4K(Test)',   '💓4K(Test)'),
              ('更新时间',    '❤️更新时间'),
          ]

          def match_group(line):
              for idx, (keyword, new_name) in enumerate(groups_order):
                  if keyword.lower() in line.lower():
                      return idx, new_name
              return -1, None

          buckets = {i: [] for i in range(len(groups_order))}
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('#EXTINF'):
                  idx, new_name = match_group(line)
                  if idx >= 0:
                      line = re.sub(r'group-title="[^"]*"', f'group-title="{new_name}"', line)
                      buckets[idx].append(line)
                      if i+1 < len(lines):
                          buckets[idx].append(lines[i+1])
                  i += 2
              else:
                  i += 1

          result = []

          # 酒店源放第一位，按 卫视→央视→其他 排序
          hotel_order = ['卫视频道', '央视频道', '其他频道']
          hotel_buckets = {g: [] for g in hotel_order}
          i = 0
          while i < len(lines2):
              line = lines2[i]
              if line.startswith('#EXTINF'):
                  matched = None
                  for g in hotel_order:
                      if g in line:
                          matched = g
                          break
                  if matched:
                      line = re.sub(r'group-title="([^"]*)"', r'group-title="🌹\1"', line)
                      hotel_buckets[matched].append(line)
                      if i+1 < len(lines2):
                          hotel_buckets[matched].append(lines2[i+1])
                  i += 2
              else:
                  i += 1
          for g in hotel_order:
              result.extend(hotel_buckets[g])

          # 主源分组按指定顺序
          for idx in range(len(groups_order)):
              result.extend(buckets[idx])

          print(f"过滤后频道数: {sum(1 for l in result if l.startswith('#EXTINF'))}")

          with open('/tmp/merged.m3u', 'w') as f:
              f.write('#EXTM3U\n')
              f.writelines(result)

          print(f"合并完成: {open('/tmp/merged.m3u').read().count('#EXTINF')}")
          PYEOF

      - name: 提交到仓库（直接放根目录）
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          cd $(basename ${{ github.repository }})
          git config user.email "bot@bot.com"
          git config user.name "bot"
          cp /tmp/merged.m3u merged.m3u
          git add merged.m3u
          git commit -m "自动合并 [skip ci]" || echo "无变化"
          git push
